[mypy]
python_version = 3.12
files = app
plugins = pydantic.mypy
strict = true
warn_unreachable = true
show_error_codes = true

[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[mypy-clerk_backend_api.*]
ignore_missing_imports = true

[mypy-openpyxl.*]
ignore_missing_imports = true

[mypy-reportlab.*]
ignore_missing_imports = true

[mypy-apscheduler.*]
ignore_missing_imports = true
