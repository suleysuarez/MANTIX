name: Mobile backend

# Contrato de la API que consume la app móvil. Solo corre cuando cambia MOVIL/backend o sus docs.
# No usa base de datos: exporta el OpenAPI como artefacto y comprueba que el contrato y los
# documentos generados (códigos de error, referencia de la API, matriz de permisos) no se desfasen.

on:
  pull_request:
    paths:
      - "MOVIL/backend/**"
      - "MOVIL/docs/**"
      - ".github/workflows/mobile-backend.yml"
  push:
    branches: [main, develop]
    paths:
      - "MOVIL/backend/**"
      - "MOVIL/docs/**"
      - ".github/workflows/mobile-backend.yml"

jobs:
  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOVIL/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: MOVIL/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Export the OpenAPI contract
        run: python -m scripts.export_openapi openapi.json
      - name: Upload the OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: mantix-movil-openapi
          path: MOVIL/backend/openapi.json
          if-no-files-found: error
      - name: Contract and generated docs are up to date
        run: pytest -q tests/test_error_codes.py tests/test_openapi_export.py tests/test_docs.py tests/test_rbac_hierarchy.py
