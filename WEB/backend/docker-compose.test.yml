# PostgreSQL desechable SOLO para las pruebas del backend. No es el stack de la web.
# Escucha en 127.0.0.1:5433 (el 5432 queda libre), sin contraseña y sin volumen:
# al bajarlo con `down` se pierden los datos. Ver «Testing and quality» en WEB/README.md.
#
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
name: mantix-test-db

services:
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mantix_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mantix_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
