name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Alembic target and the database the integration tests run against
      # (roles/permissions/priorities come from the migrations; every test rolls back).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mantix_ci
      MIGRATED_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mantix_ci
      # Disposable database for repository tests: create_all/drop_all per test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mantix_ci_test
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Type check (mypy, strict)
        run: mypy
      - name: App imports
        run: python -c "from app.main import app; assert app.title"
      - name: Audit Python dependencies (informational)
        continue-on-error: true
        run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Migrations apply cleanly on a fresh database
        run: alembic upgrade head
      - name: Models and migrations agree (no schema drift)
        run: alembic check
      - name: Create the disposable test database
        run: psql -h localhost -U postgres -c "CREATE DATABASE mantix_ci_test"
      - name: Tests with coverage
        run: pytest -ra --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Audit npm dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp backend/.env.example backend/.env
      - run: docker compose config --quiet
      - name: Build images
        run: docker compose build
      - name: Smoke test the API container (PostgreSQL + migrations + /health)
        run: |
          docker compose up -d db backend
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q backend)")
            [ "$status" = "healthy" ] && break
            sleep 3
          done
          docker compose ps
          [ "$status" = "healthy" ] || { docker compose logs backend; exit 1; }
          curl --fail --silent http://localhost:8000/health
          # runs as a non-root user
          test "$(docker compose exec -T backend id -u)" != "0"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
