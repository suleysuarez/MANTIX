# Mobile API stack.
#
# Configure MOVIL/backend/.env with the Neon DATABASE_URL before starting:
#   cd MOVIL
#   docker compose up --build -d
#
# API: http://localhost:8001 (Android emulator: http://10.0.2.2:8001)

name: mantix-movil

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_PORT: 8000
      RUN_MIGRATIONS: "false"
      UPLOAD_DIR: /data/uploads
    ports:
      - "${MOVIL_BACKEND_PORT:-8001}:8000"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads:
