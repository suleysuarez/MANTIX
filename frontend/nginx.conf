server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # El runtime config nunca debe quedar en caché: cambia entre entornos.
  location = /assets/config.json {
    add_header Cache-Control "no-store";
  }

  # Archivos con hash de Angular: caché larga.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Fallback de la SPA: los enlaces directos (/auth/login, /equipos…) sirven index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
