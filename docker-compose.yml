# Development stack: PostgreSQL + API (+ Angular frontend).
#
#   docker compose up --build                 # everything, local PostgreSQL
#   docker compose up --build db backend      # API only
#
# Production uses Neon: set DATABASE_URL in backend/.env, start only the API
# (`docker compose up -d --no-deps backend`) and run migrations as a release step
# (`docker compose run --rm backend alembic upgrade head`).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mantix
      POSTGRES_PASSWORD: mantix
      POSTGRES_DB: mantix
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mantix -d mantix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      BACKEND_PORT: 8000
      # Points the API at the local database; set COMPOSE_DATABASE_URL to use another.
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://mantix:mantix@db:5432/mantix}
      RUN_MIGRATIONS: "true"
      UPLOAD_DIR: /data/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # python:3.12-slim has no curl; urllib is part of the stdlib.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
